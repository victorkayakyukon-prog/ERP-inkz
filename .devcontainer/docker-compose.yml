# Codespaces/devcontainer stack: a Node workspace plus its own Postgres.
# Nothing here is used by the production docker-compose.yml at the repo root.
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/signshop?schema=public
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: signshop
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
